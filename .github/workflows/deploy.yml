# ──────────────────────────────────────────────────────────────────────────
# Deploy the Forge AI Toolkit docs site to GitHub Pages.
#
# Builds the Docusaurus site with Yarn and publishes the `build/` output.
# A custom domain (forge-ai-docs.aoneahsan.com) is configured via static/CNAME,
# which Docusaurus copies into build/ on every build.
#
# Note: this repo can ALSO be deployed to Firebase Hosting (see DEPLOY.md /
# firebase.json target `forge-ai-docs`). Pick whichever host you point DNS at.
# ──────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Docusaurus)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build site
        run: yarn build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
